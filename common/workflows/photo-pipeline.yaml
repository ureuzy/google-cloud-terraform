# 写真の取り込みと解析: みてねから取り込み (mitene-downloader)、終わったらすぐ、写っているもの (photo-tagger) と顔 (face-indexer) を同時に調べる。
# 前は時刻をずらして動かしていたが、取り込みの長さによって待ちすぎたり、追い越したりしたため。
#
# - 取り込みが一部失敗しても、保存できた写真はあるので、解析は動かす (最後にワークフローを失敗にする)
# - 2 つの解析は書くファイルも計算する場所も別なので、同時に動かしてよい。片方が失敗しても、もう片方は最後まで動かす
# - Job が終わるのを待つ間の問い合わせは 1 回ずつステップとして数えられる (無料枠は月 5,000)。
#   最初の設定 (最大 60 秒ごと) では月の無料枠を超えることがあるので、最大 5 分ごとにする
# - common-api (システム管理の画面) は、main の上から順のステップごとに Job の名前を読み、同じステップの Job を「同時に」として出す
# - 結果は Job ごとに Slack に送らず、データのバケットの photo-pipeline/{実行 ID}/{Job}.json に書いてもらう (環境変数 REPORT_OBJECT)。
#   最後に 1 つの投稿 (Job ごとに 1 行) にまとめ、Job ごとの詳しい結果をスレッドに返信する (notify)。
#   送れなくてもワークフローは失敗にしない (写真の取り込みと解析はできているため)
main:
  params: [args]
  steps:
    - init:
        assign:
          - parent: ${"projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/locations/asia-northeast1/jobs/"}
          - reports: ${"photo-pipeline/" + sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID") + "/"}
          - started: ${sys.now()}
          - wait:
              timeout: 10800
              polling_policy:
                initial_delay: 10
                multiplier: 2
                max_delay: 300
          - downloadError: null
          - tagError: null
          - faceError: null
    - download:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${parent + "mitene-downloader"}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: REPORT_OBJECT
                        value: ${reports + "mitene-downloader.json"}
            connector_params: ${wait}
        except:
          as: e
          assign:
            - downloadError: ${e}
    # 枝ごとに失敗を受け止めて、両方が終わってから通知する (失敗にするのは最後の finish)
    - analyze:
        parallel:
          shared: [tagError, faceError]
          branches:
            - tags:
                steps:
                  - photo_tagger:
                      try:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: ${parent + "photo-tagger"}
                          body:
                            overrides:
                              containerOverrides:
                                - env:
                                    - name: REPORT_OBJECT
                                      value: ${reports + "photo-tagger.json"}
                          connector_params: ${wait}
                      except:
                        as: e
                        assign:
                          - tagError: ${e}
            - faces:
                steps:
                  - face_indexer:
                      try:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: ${parent + "face-indexer"}
                          body:
                            overrides:
                              containerOverrides:
                                - env:
                                    - name: REPORT_OBJECT
                                      value: ${reports + "face-indexer.json"}
                          connector_params: ${wait}
                      except:
                        as: e
                        assign:
                          - faceError: ${e}
    - notify:
        try:
          call: notify
          args:
            reports: ${reports}
            started: ${started}
            errors:
              mitene-downloader: ${downloadError}
              photo-tagger: ${tagError}
              face-indexer: ${faceError}
        except:
          as: e
          steps:
            - log_notify_error:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    message: failed to notify slack
                    error: ${e}
    - finish:
        switch:
          - condition: ${downloadError != null}
            raise: ${downloadError}
          - condition: ${tagError != null}
            raise: ${tagError}
          - condition: ${faceError != null}
            raise: ${faceError}

# notify は、3 つの Job の結果を Slack (#google_cloud) にまとめる。本文に Job ごとの 1 行、スレッドに Job ごとの詳しい結果 (Job が書いた囲み)。
# 結果のファイルがない (Job ごと落ちた) ときは「結果なし」とし、ワークフローが受け取ったエラーを返信に出す。
# トークンは billing-monitor と同じボット (slack-ai-bot)。Webhook ではスレッドに返信できないため
notify:
  params: [reports, started, errors]
  steps:
    - init_notify:
        assign:
          - jobs:
              - id: mitene-downloader
                label: 📥 みてね
                title: みてね取り込み（mitene-downloader）
              - id: photo-tagger
                label: 🏷️ 写っているもの
                title: 写っているもの（photo-tagger）
              - id: face-indexer
                label: 🙂 顔
                title: 顔（face-indexer）
          - results: {}
          - lines: ""
          - failed: false
          - stopped: false
          - channel: "#google_cloud"
    - read_reports:
        for:
          value: job
          in: ${jobs}
          steps:
            - read_report:
                try:
                  call: googleapis.storage.v1.objects.get
                  args:
                    bucket: ureuzy-family-data
                    object: ${text.url_encode(reports + job.id + ".json")}
                    alt: media
                  result: raw
                except:
                  as: e
                  assign:
                    - raw: null
            - decode_report:
                switch:
                  - condition: ${get_type(raw) == "bytes" or get_type(raw) == "string"}
                    assign:
                      - raw: ${json.decode(raw)}
            - keep_report:
                assign:
                  - results[job.id]: ${raw}
            - add_line:
                switch:
                  - condition: ${raw == null}
                    assign:
                      - lines: ${lines + "\n" + job.label + "　*Job が失敗（結果なし）*"}
                      - failed: true
                  - condition: true
                    assign:
                      - lines: ${lines + "\n" + job.label + "　" + raw.summary}
                      - failed: ${failed or raw.status == "error" or errors[job.id] != null}
                      - stopped: ${stopped or raw.status == "warning"}
    - headline:
        switch:
          - condition: ${failed}
            assign:
              - mark: ❌ 一部失敗
          - condition: ${stopped}
            assign:
              - mark: ⚠️ 一部途中まで
          - condition: true
            assign:
              - mark: ✅ ぜんぶ成功
    - token:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: slack-ai-bot
          project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
        result: token
    - post:
        call: http.post
        args:
          url: https://slack.com/api/chat.postMessage
          headers:
            Authorization: ${"Bearer " + token}
            Content-Type: application/json; charset=utf-8
          body:
            channel: ${channel}
            username: Photo Pipeline
            icon_emoji: ":camera:"
            text: ${"*写真の取り込みと解析*　" + mark + "（" + text.substring(time.format(started, "Asia/Tokyo"), 11, 16) + " 開始・" + string(int((sys.now() - started) / 60)) + " 分）" + lines}
        result: posted
    - check_post:
        switch:
          - condition: ${not posted.body.ok}
            raise: '${"slack " + posted.body.error}'
    - replies:
        for:
          value: job
          in: ${jobs}
          steps:
            - reply_body:
                switch:
                  - condition: ${results[job.id] == null}
                    assign:
                      - title: ${"*" + job.title + "*"}
                      - error: ${json.encode_to_string(errors[job.id])}
                      - attachments:
                          - color: danger
                            title: Job が失敗（結果なし）
                            text: ${text.substring(error, 0, math.min(len(error), 1500))}
                  - condition: true
                    assign:
                      - title: ${"*" + job.title + "*　" + string(int(results[job.id].seconds / 60)) + " 分"}
                      - attachments: ${results[job.id].attachments}
            - reply:
                call: http.post
                args:
                  url: https://slack.com/api/chat.postMessage
                  headers:
                    Authorization: ${"Bearer " + token}
                    Content-Type: application/json; charset=utf-8
                  body:
                    channel: ${channel}
                    thread_ts: ${posted.body.ts}
                    username: Photo Pipeline
                    icon_emoji: ":camera:"
                    text: ${title}
                    attachments: ${attachments}
