# 写真の取り込みと解析: みてねから取り込み (mitene-downloader)、終わったらすぐ、写っているもの (photo-tagger) と顔 (face-indexer) を同時に調べる。
# 前は時刻をずらして動かしていたが、取り込みの長さによって待ちすぎたり、追い越したりしたため。
#
# - 取り込みが一部失敗しても、保存できた写真はあるので、解析は動かす (最後にワークフローを失敗にする)
# - 2 つの解析は書くファイルも計算する場所も別なので、同時に動かしてよい。片方が失敗しても、もう片方は最後まで動かす
# - Job が終わるのを待つ間の問い合わせは 1 回ずつステップとして数えられる (無料枠は月 5,000)。
#   最初の設定 (最大 60 秒ごと) では月の無料枠を超えることがあるので、最大 5 分ごとにする
# - common-api (システム管理の画面) は、main の上から順のステップごとに Job の名前を読み、同じステップの Job を「同時に」として出す
# - 結果は Job ごとに Slack に送らず、データのバケットの photo-pipeline/{実行 ID}/{Job}.json に書いてもらう (環境変数 REPORT_OBJECT)。
#   最後に 1 つの投稿 (Job ごとに名前と結果) にまとめ、Job ごとの詳しい結果をスレッドに返信する (notify)。
#   送れなくてもワークフローは失敗にしない (写真の取り込みと解析はできているため)
# - Job を動かすときに Cloud Run の API に届かなかった (ConnectionError) ときは、少し待ってやり直す (unreachable)。
#   2026-11-05 0:00 に一度届かず、mitene-downloader が動かないまま失敗になった。Job の中で起きたエラーはやり直さない。
#   Job が始まったあとに届かなくなってやり直しても、3 つの Job は続きからやるので、同じ写真を 2 回扱わない
main:
  params: [args]
  steps:
    - init:
        assign:
          - parent: ${"projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/locations/asia-northeast1/jobs/"}
          - reports: ${"photo-pipeline/" + sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID") + "/"}
          - started: ${sys.now()}
          - wait:
              timeout: 10800
              polling_policy:
                initial_delay: 10
                multiplier: 2
                max_delay: 300
          - downloadError: null
          - tagError: null
          - faceError: null
    - download:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${parent + "mitene-downloader"}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: REPORT_OBJECT
                        value: ${reports + "mitene-downloader.json"}
            connector_params: ${wait}
        retry:
          predicate: ${unreachable}
          max_retries: 3
          backoff:
            initial_delay: 10
            max_delay: 60
            multiplier: 2
        except:
          as: e
          assign:
            - downloadError: ${e}
    # 枝ごとに失敗を受け止めて、両方が終わってから通知する (失敗にするのは最後の finish)
    - analyze:
        parallel:
          shared: [tagError, faceError]
          branches:
            - tags:
                steps:
                  - photo_tagger:
                      try:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: ${parent + "photo-tagger"}
                          body:
                            overrides:
                              containerOverrides:
                                - env:
                                    - name: REPORT_OBJECT
                                      value: ${reports + "photo-tagger.json"}
                          connector_params: ${wait}
                      retry:
                        predicate: ${unreachable}
                        max_retries: 3
                        backoff:
                          initial_delay: 10
                          max_delay: 60
                          multiplier: 2
                      except:
                        as: e
                        assign:
                          - tagError: ${e}
            - faces:
                steps:
                  - face_indexer:
                      try:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: ${parent + "face-indexer"}
                          body:
                            overrides:
                              containerOverrides:
                                - env:
                                    - name: REPORT_OBJECT
                                      value: ${reports + "face-indexer.json"}
                          connector_params: ${wait}
                      retry:
                        predicate: ${unreachable}
                        max_retries: 3
                        backoff:
                          initial_delay: 10
                          max_delay: 60
                          multiplier: 2
                      except:
                        as: e
                        assign:
                          - faceError: ${e}
    - notify:
        try:
          call: notify
          args:
            reports: ${reports}
            started: ${started}
            errors:
              mitene-downloader: ${downloadError}
              photo-tagger: ${tagError}
              face-indexer: ${faceError}
        except:
          as: e
          steps:
            - log_notify_error:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    message: failed to notify slack
                    error: ${e}
    - finish:
        switch:
          - condition: ${downloadError != null}
            raise: ${downloadError}
          - condition: ${tagError != null}
            raise: ${tagError}
          - condition: ${faceError != null}
            raise: ${faceError}

# notify は、3 つの Job の結果を Slack (#general) にまとめる (Block Kit)。
# - 本文: 見出し、結果 (✅・⚠️・❌)・始めた時刻・かかった時間、Job ごとに名前 (太字) と結果の行。途中でやめた・エラーは、その下に 1 行ずつ (Job が書いた notes)
# - スレッド: Job ごとに 1 件。名前と Job の名前・かかった時間、Job が書いた囲み
# 結果のファイルがない (Job ごと落ちた) ときは「結果なし」とし、ワークフローが受け取ったエラーを返信に出す。
# トークンは billing-monitor と同じボット (slack-ai-bot)。Webhook ではスレッドに返信できないため。
# 名前とアイコン (username・icon_emoji) を変えるので、ボットに chat:write.customize が要る
notify:
  params: [reports, started, errors]
  steps:
    - init_notify:
        assign:
          - jobs:
              - id: mitene-downloader
                name: 📥 みてね
                title: 📥 みてね取り込み
              - id: photo-tagger
                name: 🏷️ 写っているもの
                title: 🏷️ 写っているもの
              - id: face-indexer
                name: 🙂 顔
                title: 🙂 顔
          - results: {}
          - sections: []
          - failed: false
          - stopped: false
          - channel: "#general"
    - read_reports:
        for:
          value: job
          in: ${jobs}
          steps:
            - read_report:
                try:
                  call: googleapis.storage.v1.objects.get
                  args:
                    bucket: ureuzy-family-data
                    object: ${text.url_encode(reports + job.id + ".json")}
                    alt: media
                  result: raw
                except:
                  as: e
                  assign:
                    - raw: null
            - decode_report:
                switch:
                  - condition: ${get_type(raw) == "bytes" or get_type(raw) == "string"}
                    assign:
                      - raw: ${json.decode(raw)}
            - keep_report:
                assign:
                  - results[job.id]: ${raw}
            - job_line:
                switch:
                  - condition: ${raw == null}
                    assign:
                      - line: ${"*" + job.name + "*\n❌ Job が失敗（結果なし）"}
                      - failed: true
                  - condition: true
                    assign:
                      - line: ${"*" + job.name + "*\n" + raw.summary}
                      - failed: ${failed or raw.status == "error" or errors[job.id] != null}
                      - stopped: ${stopped or raw.status == "warning"}
            # and が先で止まるとは限らないので、結果がないときに raw の中を見ないよう、分けて確かめる
            - job_notes:
                switch:
                  - condition: ${raw != null}
                    steps:
                      - has_notes:
                          switch:
                            - condition: ${"notes" in raw}
                              steps:
                                - add_notes:
                                    for:
                                      value: note
                                      in: ${raw.notes}
                                      steps:
                                        - add_note:
                                            assign:
                                              - line: ${line + "\n" + note}
            - add_section:
                assign:
                  - section:
                      type: section
                      text:
                        type: mrkdwn
                        text: ${line}
                  - sections: ${list.concat(sections, section)}
    - headline:
        switch:
          - condition: ${failed}
            assign:
              - mark: ❌ 一部失敗
          - condition: ${stopped}
            assign:
              - mark: ⚠️ 一部途中まで
          - condition: true
            assign:
              - mark: ✅ ぜんぶ成功
    # 始めた時刻は「0:00」の形 (時の先頭の 0 は付けない)。かかった時間は 1 分未満なら秒
    - when:
        assign:
          - startedAt: ${time.format(started, "Asia/Tokyo")}
          - startedText: ${string(int(text.substring(startedAt, 11, 13))) + ":" + text.substring(startedAt, 14, 16)}
          - took: ${sys.now() - started}
    - took_text:
        switch:
          - condition: ${took < 60}
            assign:
              - tookText: ${string(int(took)) + " 秒"}
          - condition: true
            assign:
              - tookText: ${string(int(took / 60)) + " 分"}
    - build_blocks:
        assign:
          - blocks:
              - type: header
                text:
                  type: plain_text
                  text: 📷 写真の取り込みと解析
              - type: context
                elements:
                  - type: mrkdwn
                    text: ${mark + "　·　" + startedText + " 開始　·　" + tookText}
              - type: divider
    - add_sections:
        for:
          value: section
          in: ${sections}
          steps:
            - add_block:
                assign:
                  - blocks: ${list.concat(blocks, section)}
    - token:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: slack-ai-bot
          project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
        result: token
    - post:
        call: http.post
        args:
          url: https://slack.com/api/chat.postMessage
          headers:
            Authorization: ${"Bearer " + token}
            Content-Type: application/json; charset=utf-8
          body:
            channel: ${channel}
            username: Photo Pipeline
            icon_emoji: ":camera:"
            # 知らせ (スマホの通知) に出る文
            text: ${"写真の取り込みと解析　" + mark}
            blocks: ${blocks}
        result: posted
    - check_post:
        switch:
          - condition: ${not posted.body.ok}
            raise: '${"slack " + posted.body.error}'
    - replies:
        for:
          value: job
          in: ${jobs}
          steps:
            - reply_body:
                switch:
                  - condition: ${results[job.id] == null}
                    assign:
                      - context: ${"`" + job.id + "`"}
                      - error: ${json.encode_to_string(errors[job.id])}
                      - attachments:
                          - color: danger
                            title: Job が失敗（結果なし）
                            text: ${text.substring(error, 0, math.min(len(error), 1500))}
                  - condition: ${results[job.id].seconds < 60}
                    assign:
                      - context: ${"`" + job.id + "`　·　" + string(results[job.id].seconds) + " 秒"}
                      - attachments: ${results[job.id].attachments}
                  - condition: true
                    assign:
                      - context: ${"`" + job.id + "`　·　" + string(int(results[job.id].seconds / 60)) + " 分"}
                      - attachments: ${results[job.id].attachments}
            - reply:
                call: http.post
                args:
                  url: https://slack.com/api/chat.postMessage
                  headers:
                    Authorization: ${"Bearer " + token}
                    Content-Type: application/json; charset=utf-8
                  body:
                    channel: ${channel}
                    thread_ts: ${posted.body.ts}
                    username: Photo Pipeline
                    icon_emoji: ":camera:"
                    text: ${job.title}
                    blocks:
                      - type: section
                        text:
                          type: mrkdwn
                          text: ${"*" + job.title + "*"}
                      - type: context
                        elements:
                          - type: mrkdwn
                            text: ${context}
                    attachments: ${attachments}

# unreachable は、Cloud Run の API に届かなかったエラーか (やり直してよい)。Job の中で起きたエラー (Job の失敗) は false
unreachable:
  params: [e]
  steps:
    - has_tags:
        switch:
          - condition: ${not ("tags" in e)}
            return: false
    - connection:
        switch:
          - condition: ${"ConnectionError" in e.tags or "ConnectionFailedError" in e.tags}
            return: true
    - other:
        return: false
